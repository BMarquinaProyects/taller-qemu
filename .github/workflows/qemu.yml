# Compila QEMU con las capas de Taller en Linux y Windows, ejecuta las pruebas de los tres chips
# y, al etiquetar vX.Y.Z, publica la release con los dos paquetes.
name: qemu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-venv flex bison \
            libglib2.0-dev libpixman-1-dev libslirp-dev libgcrypt20-dev
      - name: Compilar
        run: bash construir.sh
      - name: Pruebas unitarias
        run: python3 -m unittest discover -s pruebas -p '*_unitarias.py'
      # Todos los modos de los tres chips (clásico, C3 y S3); spi_dma se omite sin el firmware de MicroPython.
      - name: Pruebas en QEMU
        run: bash pruebas/todas.sh .trabajo/instalar-x86_64-linux-gnu/qemu/bin/qemu-system-xtensa
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-linux
          path: dist/*.tar.xz

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils git tar xz
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-libgcrypt mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-gettext
      - name: Compilar
        run: bash construir.sh
      # También el C3 y el S3: hay fallos que solo salen en Windows, donde `long` tiene 32 bits (E-045).
      - name: Pruebas en QEMU
        env:
          PYTHONIOENCODING: utf-8
        run: bash pruebas/todas.sh .trabajo/instalar-x86_64-w64-mingw32/qemu/bin/qemu-system-xtensa.exe
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-windows
          path: dist/*.tar.xz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.xz -R "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "QEMU de Espressif (esp-develop-9.2.2-20260417) con las capas de Taller. Ver AVISO.md."

# Firmware de la prueba fpu (M-160). Se compila con el Rust de Xtensa de espup:
#   cargo build --release && espflash save-image --chip esp32 --merge --flash-mode dio \
#     --flash-size 4mb target/xtensa-esp32-none-elf/release/fpu_prueba ../fpu_prueba.flash.bin
# y se rellena con 0xFF hasta 4 MiB.
[package]
name = "fpu_prueba"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fpu_prueba"
path = "src/main.rs"

[workspace]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32", "uart", "critical-section"] }

[profile.release]
opt-level = "s"
debug = false
codegen-units = 1
